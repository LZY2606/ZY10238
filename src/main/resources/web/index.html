<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>表型生长轨工坊</title>
<style>
:root{--ink:#17211b;--muted:#65736b;--line:#d9e2dc;--panel:#fbfdfb;--accent:#257a52;--warn:#b45309}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;background:#f4f7f5;color:var(--ink)}header{padding:22px 28px;background:linear-gradient(120deg,#173f2b,#2c7a54);color:white}h1{margin:0 0 6px;font-size:28px}header p{margin:0;opacity:.88}main{display:grid;grid-template-columns:330px 1fr;gap:18px;padding:18px 24px 30px}aside,section.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 10px rgba(22,54,37,.05)}aside{padding:16px;align-self:start;position:sticky;top:14px;max-height:calc(100vh - 28px);overflow:auto}section.panel{padding:18px;margin-bottom:18px}h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:16px 0 8px}label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}select,input,textarea,button{font:inherit}select,textarea,input[type=number]{width:100%;padding:8px 9px;border:1px solid #b9c8bf;border-radius:8px;background:white}button{border:0;border-radius:8px;background:var(--accent);color:white;padding:8px 12px;cursor:pointer}button.secondary{background:#e5eee8;color:#183b29}button.warn{background:var(--warn)}.row{display:flex;gap:8px;align-items:end}.row>*{flex:1}.checkline{display:flex;gap:7px;align-items:center;margin:8px 0;color:var(--ink);font-size:13px}.checkline input{width:auto}.plant-list{display:grid;gap:6px;margin-top:10px}.plant-list button{text-align:left;background:#eef5f1;color:var(--ink);font-size:12px;padding:7px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.card{border:1px solid var(--line);background:white;border-radius:10px;padding:10px}.muted{color:var(--muted);font-size:12px}.pill{display:inline-flex;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600}.good,.IDENTIFIED,.ESTIMATED{background:#dcfce7;color:#166534}.questionable,.ESTIMATED_SINGLE_BATCH{background:#fef3c7;color:#92400e}.bad,.NOT_IDENTIFIED,.DESIGN_GAP,.UNCONFIRMED{background:#fee2e2;color:#991b1b}table{border-collapse:collapse;width:100%;font-size:12px}th,td{text-align:left;border-bottom:1px solid var(--line);padding:7px 6px;vertical-align:top}th{color:var(--muted)}.chart{width:100%;min-height:360px;border:1px solid var(--line);border-radius:10px;background:white}.raw-dot{fill:#2f7c58}.raw-dot.questionable{fill:#d97706}.raw-dot.bad{fill:#dc2626}.candidate{fill:none;stroke:#8aa598;stroke-width:1.6;stroke-dasharray:5 4}.selected-curve{fill:none;stroke:#257a52;stroke-width:2.8}.extrapolation{stroke:#c2410c;stroke-width:2.5;stroke-dasharray:6 4}.boundaryline{stroke:#64748b;stroke-width:1.5;stroke-dasharray:4 4}svg text{font-size:11px;fill:#41514a}.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 10px}.tabs button{background:#e5eee8;color:var(--ink);padding:6px 10px}.tabs button.active{background:var(--accent);color:white}.note{border-left:4px solid #257a52;background:#edf7f1;padding:8px 10px;border-radius:6px;margin:6px 0;font-size:13px}.note.warning{border-color:#b45309;background:#fff7ed}.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:10}.modal.open{display:flex}.modal-box{background:white;width:min(680px,92vw);max-height:86vh;overflow:auto;border-radius:14px;padding:18px}code{background:#edf2ef;padding:1px 4px;border-radius:4px}a{color:#166534}@media(max-width:980px){main{grid-template-columns:1fr}aside{position:static;max-height:none}}
</style>
</head>
<body>
<header><h1>表型生长轨工坊</h1><p>保留原始重复观测，固定设计表与预处理版本，估计换机偏移、生长曲线和基因型×处理差异。</p></header>
<main><aside>
<h2>分析控制</h2><label>性状</label><select id="trait"><option value="leaf_area">叶面积 cm²</option><option value="height">株高 cm</option><option value="canopy_width">冠幅 cm</option></select>
<label>目标日</label><input id="targetDay" type="number" min="0" max="60" value="16"><div class="row"><div><label>个体</label><select id="plantSelect"></select></div><button id="refreshBtn">刷新</button></div>
<div class="checkline"><input id="persistRun" type="checkbox" checked><span>保存为固定版本运行</span></div><div class="row"><button id="runBtn">运行分析</button><button class="secondary" id="previewBtn">试算不保存</button></div>
<h3>相机更换边界</h3><div id="boundaryControls" class="plant-list"></div><h3>参照排除（验收用）</h3><p class="muted">仅排除重叠参照；少于两株有同日重叠时偏移不可识别。</p><div id="referenceControls"></div>
<h3>数据</h3><div class="row"><button class="secondary" id="exportLogsBtn">导出操作记录</button><button class="warn" id="reimportBtn">清空重导入</button></div></aside>
<div><section class="panel"><h2>固定口径与数据覆盖</h2><div id="versionCards" class="grid"></div><div id="coverage"></div><div id="notes"></div></section>
<section class="panel"><h2>个体曲线与原始观测</h2><div id="plantMeta" class="muted"></div><div class="tabs" id="modelTabs"></div><svg id="chart" class="chart" viewBox="0 0 900 360"></svg><table id="observationTable"></table></section>
<section class="panel"><h2>批次换机偏移</h2><div id="offsets" class="grid"></div></section>
<section class="panel"><h2>处理差异与设计空缺</h2><div id="cells"></div><h3>差异中的差异（G2 与 G1 相对处理反应）</h3><div id="interactions"></div></section>
<section class="panel"><h2>运行记录</h2><div id="runs"></div></section></div></main>
<div class="modal" id="qualityModal"><div class="modal-box"><h2>修正质量状态</h2><p class="muted">原始质量永不覆盖；修正会产生新的预处理版本。同日重复保留各自质量。</p><label>观测</label><input id="qualityObservation" readonly><label>质量</label><select id="qualityValue"><option value="good">good 纳入</option><option value="questionable">questionable 保留并纳入</option><option value="bad">bad 排除</option></select><label>原因</label><textarea id="qualityReason" rows="3"></textarea><div class="row" style="margin-top:12px"><button id="saveQualityBtn">保存修正</button><button class="secondary" id="closeQualityBtn">取消</button></div></div></div>
<script src="app.js"></script></body></html>
